name: Validate

on:
  push:
  pull_request:

jobs:
  esphome-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # dummy secrets so `esphome config` can resolve the !secret references - none of these
      # need to be real, the job only validates the config, it never builds or flashes firmware
      - name: Write dummy secrets.yaml
        run: |
          cat > secrets.yaml << 'EOF'
          wifi_ssid: "ci_ssid"
          wifi_password: "ci_password"
          ap_fallback_password: "ci_password"
          api_encryption_key: "1BXOJ8LOKrO4wIn9dxdIH4CmDrTiiSGDcyusIB0dNvE="
          ota_password: "ci_ota_password"
          EOF

      - name: Install ESPHome
        run: pip install esphome

      - name: Validate jkbms-ghost-battery.yaml
        run: esphome config jkbms-ghost-battery.yaml

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install esphome pytest

      - name: Run tests
        run: pytest tests/ -v
